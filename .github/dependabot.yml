version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src/Voltura.HardTop", "/tests/HardTop.Checks"]
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
